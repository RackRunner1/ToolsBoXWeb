name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o server ./cmd/tbxm

      - name: Generate release tag
        id: release
        run: bash .github/scripts/compute-release-tag.sh

      - name: Generate changelog
        id: notes
        env:
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          LAST_TAG: ${{ steps.release.outputs.last_tag }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: server

      - name: Rewrite commit authors and push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.TOKEN_GITLAB }}
        run: |
          git fetch --force --tags origin

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_NAME" = "RackRunner1" ] && [ "$GIT_AUTHOR_EMAIL" = "325587735+RackRunner1@users.noreply.github.com" ]; then
            export GIT_AUTHOR_NAME="RackRunner"
            export GIT_AUTHOR_EMAIL="44419098-RackRunner@users.noreply.gitlab.com"
          fi
          if [ "$GIT_COMMITTER_NAME" = "RackRunner1" ] && [ "$GIT_COMMITTER_EMAIL" = "325587735+RackRunner1@users.noreply.github.com" ]; then
            export GIT_COMMITTER_NAME="RackRunner"
            export GIT_COMMITTER_EMAIL="44419098-RackRunner@users.noreply.gitlab.com"
          fi
          ' --tag-name-filter cat -- --all

          git push --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/ToolsBoXCompany/ToolsBoXWeb.git" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Create GitLab Release
        env:
          GITLAB_TOKEN: ${{ secrets.TOKEN_GITLAB }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          BODY: ${{ steps.notes.outputs.body }}
          REPO: ${{ github.repository }}
        run: |
          API="https://gitlab.com/api/v4/projects/ToolsBoXCompany%2FToolsBoXWeb/releases"
          LINK_URL="https://github.com/${REPO}/releases/download/${TAG}/server"
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --arg desc "$BODY" --arg url "$LINK_URL" \
            '{tag_name: $tag, name: $name, description: $desc, assets: {links: [{name: "server", url: $url}]}}')

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "$API/$TAG")
          if [ "$STATUS" = "200" ]; then
            METHOD=PUT
            URL="$API/$TAG"
          else
            METHOD=POST
            URL="$API"
          fi

          curl -sf -X "$METHOD" -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$URL" > /dev/null
