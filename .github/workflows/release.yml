name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o server ./cmd/tbxm

      - name: Generate release tag
        id: release
        run: bash .github/scripts/compute-release-tag.sh

      - name: Generate changelog
        id: notes
        env:
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          LAST_TAG: ${{ steps.release.outputs.last_tag }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: server
